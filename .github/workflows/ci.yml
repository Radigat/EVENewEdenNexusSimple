name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift package tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Planner info panel upkeep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 Scripts/check_planner_guide.py --self-test
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python3 Scripts/check_planner_guide.py "$BASE_SHA" HEAD
          else
            python3 Scripts/check_planner_guide.py
          fi

      - name: Show Swift version
        run: swift --version

      - name: Build and test
        run: swift test
